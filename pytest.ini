[pytest]
# 標 real 的測試對全部真實素材逐份跑 Tesseract(一兩分鐘),平常不跑。
# 改到「每一份選哪頁」這類評分規則時:pytest -m real
# (命令列的 -m 會蓋過這裡的預設值。)
# 標 vision 的測試真的打 Google Vision(花錢、要憑證):pytest -m vision
addopts = -m "not real and not vision"
markers =
    real: 對全部真實素材(samples/docs/)逐份跑 Tesseract 的慢測試;用 -m real 才跑
    vision: 真的打 Google Vision 的測試(花錢、要憑證);用 -m vision 才跑
